<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart of Hearts — Revised deck</title><link rel="stylesheet" href="style.css?v=177"><style>main{max-width:1650px}h1{font:38px Georgia,serif}.draft-note{max-width:800px;line-height:1.6;color:#d6c6df}.deck-group{display:flex;flex-wrap:wrap;gap:22px;padding:28px;border-radius:25px}.deck-group .card{width:240px;min-width:240px;height:410px;min-height:410px;padding:23px}.deck-group .card-art{height:96px;min-height:96px;margin:22px 0}.deck-group .card-text{font-size:16px;line-height:1.4}.deck-group .card-name{font-size:24px}.deck-group .card-top{min-height:20px}.card.joker .card-art:before,.card.joker .card-art:after{content:none}.joker-index{position:absolute;writing-mode:vertical-rl;text-orientation:upright;font:700 12px Georgia,serif;letter-spacing:2px;z-index:3;pointer-events:none}.joker-index.left{top:19px;left:10px}.joker-index.right{bottom:19px;right:10px;transform:rotate(180deg)}.card.joker .card-top{padding-left:12px}.card.joker .card-text{padding-right:8px}.card.bad{background:linear-gradient(135deg,#0e1018,#30303e,#11121b);border:2px solid #9a8eae;color:#e9dff3}.card.dud{background:#d9d1bd;color:#615d54;border:4px solid transparent;background:linear-gradient(#d9d1bd,#d9d1bd) padding-box,conic-gradient(#9c929e,#a0aeb1,#a4af99,#bdac8c,#a38b96,#9c929e) border-box;box-shadow:none}.card.dud .living-symbol{animation:none}.card.win[data-card="Sun"]{background:linear-gradient(135deg,#ba8424,#ffdf78 35%,#fff1b0 50%,#e8b13f 75%,#ffe39a);color:#513509}.card.joker{background:linear-gradient(125deg,#eadcff,#ffd1e6 20%,#d2f4ff 40%,#d7f5dd 58%,#fff0ad 76%,#e2ccff);color:#30213e}.card[data-card="Fleeting Illusion"]{background:linear-gradient(135deg,#e7d9f6,#b8d9e4,#dfc5ed);color:#36234b}nav{display:flex;flex-wrap:wrap;gap:15px;margin:25px 0}a{color:#ecd8a5}@media(max-width:560px){.deck-group{padding:15px;justify-content:center}main{padding:15px}}
.card.win[data-card="Deadlock"]{background:linear-gradient(135deg,#123b40,#256268 45%,#15393e);color:#fff0da;border-color:#dea775;box-shadow:inset 0 0 0 2px #122d32,inset 0 0 0 3px #edbf8b99,0 6px 18px #0006}

</style><main><h1>Your updated deck</h1><p class="draft-note">All 83 card designs. Each game uses 70 cards: 2 of 14 Jokers and 8 of 10 Instants, including Grim Reaper and Death’s Door.</p><nav id="nav"></nav><div id="groups"></div><a href="./">Play Heart of Hearts</a></main><script src="cards.js?v=177"></script><script src="artwork.js?v=177"></script><script>const groups=[['Legendaries','legendary'],['Jokers — two per game','joker'],['Cursed Moon','bad'],['Dud','dud'],['Win conditions','win']];for(const [title,type] of groups){const section=document.createElement('section');section.id=type;const h=document.createElement('h2');h.textContent=title;const grid=document.createElement('div');grid.className='deck-group design-mat';for(const c of HOHCards.cards.filter(c=>c.type===type)){const n=document.createElement('article');n.className='card '+c.type;n.dataset.card=c.id;const label=type==='win'?'Win condition':type==='joker'?'Legendary':type==='instant'?'⚡ Instant':type==='bad'?'End game':type==='dud'?'':type;n.innerHTML='<div class="card-top"><span>'+c.rank+c.suit+'</span><span class="card-type">'+label+'</span></div><div class="card-art">'+HOHArt.markup(c.art||c.effect)+'</div><div class="card-name">'+c.name+'</div><div class="card-text">'+c.text+'</div>';if(type==='joker'){n.innerHTML+='<span class="joker-badge" aria-hidden="true">'+HOHArt.markup('joker2')+'</span><span class="joker-badge joker-badge-opposite" aria-hidden="true">'+HOHArt.markup('joker2')+'</span>';}if(type==='joker')n.innerHTML+='<span class="joker-index left" aria-hidden="true">JOKER</span><span class="joker-index right" aria-hidden="true">JOKER</span>';if(c.effect==='reaper')n.innerHTML+='<div class="reaper-slots">♡ ♡ ♡ ♡ ♡</div>';grid.append(n)}section.append(h,grid);document.getElementById('groups').append(section);const link=document.createElement('a');link.href='#'+type;link.textContent=title;document.getElementById('nav').append(link);}</script></html>
