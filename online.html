<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart of Hearts · Online</title><link rel="stylesheet" href="style.css?v=183"><link rel="stylesheet" href="menu.css?v=183"><link rel="stylesheet" href="characters.css?v=183"><link rel="stylesheet" href="online.css?v=183"><link rel="stylesheet" href="responsive.css?v=183"></head><body class="online-game"><header class="online-header"><button id="chat-toggle" class="chat-toggle" aria-controls="room-chat" aria-expanded="false" hidden>Chat <span id="chat-unread" hidden></span></button><a class="brand" href="./">♥ HEART OF HEARTS</a><span id="connection" role="status">Connecting…</span><a class="online-home" href="./">Main menu</a></header><main id="online-root"><section id="online-entry" class="online-entry"><small class="season-eyebrow">YOUR FRIENDS · YOUR TABLE</small><h1>Play together.</h1><p id="entry-message">Create a room or join your friends.</p><label>Your name<input id="online-name" maxlength="24" autocomplete="nickname" placeholder="Your name"></label><div class="online-entry-actions"><button id="create-private">Create private room</button><button id="create-public">Find public room</button></div><div class="online-join"><label>Room code<input id="online-code" maxlength="6" placeholder="ROOM CODE" autocapitalize="characters"></label><button id="join-room">Join room</button></div></section><section id="online-lobby" class="online-lobby" hidden><div class="online-lobby-heading"><small class="season-eyebrow" id="room-type">PRIVATE ROOM</small><h1>Your table.</h1><p>Room <strong id="room-code"></strong></p></div><div id="online-seats" class="online-seats"></div><div class="online-lobby-actions"><button id="online-invite">Invite friends</button><button id="online-ready">Ready</button><button id="online-start">Start match</button><button id="online-leave">Leave room</button></div><p id="lobby-note"></p><input id="invite-link" aria-label="Invite link" readonly hidden></section><section id="online-match" hidden><div class="online-turn"><div><small id="online-round">ROUND 1</small><h1 id="online-turn-name"></h1></div><span id="online-actions"></span><button id="online-draw">Draw · end turn</button></div><section class="table online-table" aria-label="Online card table"><div class="table-grain"></div><div id="online-players"></div><div class="online-piles"><div><button id="online-deck" class="back purple" aria-label="Draw a card and end your turn"><span>✦</span><b>H♥H</b><span>✦</span></button><p id="online-deck-count"></p></div><div><div id="online-discard"></div><p>PLAYED / DISCARD</p></div><div class="online-pile-clock"><span id="online-move-clock" role="timer" aria-label="Time remaining for the next move"></span></div></div><div class="online-table-status"><p id="online-status" role="status" aria-live="polite"></p><p id="online-hint"></p></div></section><section class="online-hand-panel"><small id="online-hand-title">YOUR PRIVATE HAND</small><div id="online-hand" class="online-hand"></div></section><details class="online-log" open><summary>Previous actions</summary><ol id="online-history"></ol></details><section id="online-ending" hidden><h2 id="online-winner"></h2><p id="online-reason"></p><button id="online-new-room">Create another room</button></section></section><p id="online-message" role="status" aria-live="polite"></p></main><aside id="room-chat" class="room-chat" aria-label="Room chat" hidden><div class="chat-heading"><h2>Table chat</h2><button id="chat-close" aria-label="Close chat">×</button></div><ol id="chat-messages" aria-label="Chat messages" aria-live="polite"></ol><form id="chat-form"><label class="chat-label" for="chat-input">Message your table</label><div class="chat-compose"><input id="chat-input" maxlength="240" placeholder="Say something…" autocomplete="off"><button id="chat-send" type="submit">Send</button></div><p id="chat-error" role="status"></p></form></aside><dialog id="online-choice"><h2 id="online-choice-title"></h2><p id="online-choice-clock"></p><div id="online-choice-options"></div></dialog><script src="cards.js?v=183"></script><script src="artwork.js?v=183"></script><script src="settings.js?v=183"></script><script src="sound-effects.js?v=183"></script><script src="online-client.js?v=183"></script><script src="game-settings.js?v=183"></script></body></html>
