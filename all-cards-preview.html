<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart of Hearts — Revised deck</title><link rel="stylesheet" href="style.css?v=177"><style>main{max-width:1650px}h1{font:38px Georgia,serif}.draft-note{max-width:800px;line-height:1.6;color:#d6c6df}.deck-group{display:flex;flex-wrap:wrap;gap:22px;padding:28px;border-radius:25px}.deck-group .card{width:240px;min-width:240px;height:410px;min-height:410px;padding:23px}.deck-group .card-art{height:96px;min-height:96px;margin:22px 0}.deck-group .card-text{font-size:16px;line-height:1.4}.deck-group .card-name{font-size:24px}.deck-group .card-top{min-height:20px}.card.joker .card-art:before,.card.joker .card-art:after{content:none}.joker-index{position:absolute;writing-mode:vertical-rl;text-orientation:upright;font:700 12px Georgia,serif;letter-spacing:2px;z-index:3;pointer-events:none}.joker-index.left{top:19px;left:10px}.joker-index.right{bottom:19px;right:10px;transform:rotate(180deg)}.card.joker .card-top{padding-left:12px}.card.joker .card-text{padding-right:8px}.card.bad{background:linear-gradient(135deg,#0e1018,#30303e,#11121b);border:2px solid #9a8eae;color:#e9dff3}.card.dud{background:#d9d1bd;color:#615d54;border:4px solid transparent;background:linear-gradient(#d9d1bd,#d9d1bd) padding-box,conic-gradient(#9c929e,#a0aeb1,#a4af99,#bdac8c,#a38b96,#9c929e) border-box;box-shadow:none}.card.dud .living-symbol{animation:none}.card.win[data-card="Sun"]{background:linear-gradient(135deg,#ba8424,#ffdf78 35%,#fff1b0 50%,#e8b13f 75%,#ffe39a);color:#513509}.card.joker{background:linear-gradient(125deg,#eadcff,#ffd1e6 20%,#d2f4ff 40%,#d7f5dd 58%,#fff0ad 76%,#e2ccff);color:#30213e}.card[data-card="Fleeting Illusion"]{background:linear-gradient(135deg,#e7d9f6,#b8d9e4,#dfc5ed);color:#36234b}nav{display:flex;flex-wrap:wrap;gap:15px;margin:25px 0}a{color:#ecd8a5}@media(max-width:560px){.deck-group{padding:15px;justify-content:center}main{padding:15px}}

nav#nav{gap:9px;padding:14px;border:1px solid #dac39333;border-radius:18px;background:linear-gradient(135deg,#302037,#201925);box-shadow:0 6px 20px #0003}#nav button{border:1px solid #dbc49a55;border-radius:11px;padding:12px 19px;color:#f4e4c3;background:linear-gradient(#49334e,#302338);font:600 15px Georgia,serif;cursor:pointer;transition:background .18s,box-shadow .18s}#nav button:hover,#nav button.selected{background:linear-gradient(135deg,#f0dcad,#c49a55);color:#302133;box-shadow:0 3px 12px #dcb76b33}#nav button:focus-visible{outline:2px solid #fff0b7;outline-offset:3px}.section-count{color:#dcc69d;margin:0 0 14px}@media(max-width:600px){#nav button{flex:1 1 130px;padding:11px}} </style><main><h1>Your updated deck</h1><p class="draft-note">Browse the full deck. Identical cards are grouped with a quantity label.</p><label for="card-filter">Show </label><select id="card-filter"><option value="all">All cards</option><option value="heart">Hearts</option><option value="utility">Utility</option><option value="legendary">Legendaries</option><option value="joker">Jokers</option><option value="win">Win conditions</option><option value="instant">Instant</option><option value="other">Non-playable</option></select> <label for="card-order">Card order </label><select id="card-order"><option value="type">Card type</option><option value="suit">Suit, then rank</option><option value="power">Power order</option><option value="name">Name</option></select><nav id="nav"></nav><div id="groups"></div><a href="./">Play Heart of Hearts</a></main><script src="cards.js?v=177"></script><script src="artwork.js?v=177"></script><script>const groups=[['Win Conditions','win'],['Jokers','joker'],['Legendaries','legendary'],['Hearts','heart'],['Utility','utility'],['Instant','instant'],['Non-playable','other']];for(const [title,type] of groups){const section=document.createElement('section');section.id=type;const h=document.createElement('h2');h.textContent=title;const grid=document.createElement('div');grid.className='deck-group design-mat';const grouped=new Map();for(const card of HOHCards.cards.filter(c=>type==='other'?['bad','dud'].includes(c.type):c.type===type)){const key=JSON.stringify([card.name,card.rank,card.suit,card.type,card.effect,card.text,card.art]);const entry=grouped.get(key);if(entry)entry.count++;else grouped.set(key,{card,count:1});}for(const {card:c,count} of grouped.values()){const n=document.createElement('article');n.className='card '+c.type+(type==='other'?' other':'');n.dataset.card=c.id;const label=type==='win'?'Win condition':type==='joker'?'Legendary':type==='instant'?'⚡ Instant':c.type==='bad'?'End game':c.type==='dud'?'':type;n.innerHTML='<div class="card-top"><span>'+c.rank+c.suit+'</span><span class="card-type">'+label+'</span></div><div class="card-art">'+HOHArt.markup(c.art||c.effect)+'</div><div class="card-name">'+c.name+(count>1?' <span class="copy-count">×'+count+'</span>':'')+'</div><div class="card-text">'+c.text+'</div>';if(type==='joker'){n.innerHTML+='<span class="joker-badge" aria-hidden="true">'+HOHArt.markup('joker2')+'</span><span class="joker-badge joker-badge-opposite" aria-hidden="true">'+HOHArt.markup('joker2')+'</span>';}if(type==='joker')n.innerHTML+='<span class="joker-index left" aria-hidden="true">JOKER</span><span class="joker-index right" aria-hidden="true">JOKER</span>';if(c.effect==='reaper')n.innerHTML+='<div class="reaper-slots">♡ ♡ ♡ ♡ ♡</div>';grid.append(n)}section.append(h);if(type==='joker'||type==='instant'){const note=document.createElement('p');note.className='section-count';note.textContent=type==='joker'?'2 of 6 Jokers per game':'All 8 Instants are included in every game.';section.append(note);}section.append(grid);document.getElementById('groups').append(section);const link=document.createElement('button');link.type='button';link.textContent=title;link.onclick=()=>{document.getElementById('card-order').value='type';document.getElementById('card-order').onchange();document.getElementById('card-filter').value=type;filterCards();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('selected',b===link));};document.getElementById('nav').append(link);}</script><script>const sections=[...document.querySelectorAll('#groups>section')],originals=sections.map(s=>[s,[...s.querySelectorAll('.card')]]);document.getElementById('card-order').onchange=function(){const cards=originals.flatMap(x=>x[1]);if(this.value==='type'){originals.forEach(([s,list])=>{s.hidden=false;s.querySelector('h2').textContent=groups.find(g=>g[1]===s.id)[0];s.querySelector('.deck-group').append(...list)});return;}const rank=c=>({J:11,Q:12,K:13,A:14}[c.rank]||Number(c.rank)||20),power=c=>c.type==='utility'?rank(c):c.type==='heart'?40-rank(c):c.type==='legendary'?50+rank(c):c.type==='joker'?80:c.type==='win'?100:110;cards.sort((a,b)=>{const x=HOHCards.byId[a.dataset.card],y=HOHCards.byId[b.dataset.card];return this.value==='name'?x.name.localeCompare(y.name):this.value==='suit'?('♣♦♥♠'.indexOf(x.suit)-'♣♦♥♠'.indexOf(y.suit)||rank(x)-rank(y)):power(x)-power(y)});sections.forEach((s,i)=>s.hidden=i>0);sections[0].querySelector('h2').textContent=this.selectedOptions[0].textContent;sections[0].querySelector('.deck-group').append(...cards);};</script><script>const filterSelect=document.getElementById('card-filter');function filterCards(){const value=filterSelect.value;for(const section of document.querySelectorAll('#groups>section')){let shown=0;for(const card of section.querySelectorAll('.card')){card.hidden=value!=='all'&&!card.classList.contains(value);if(!card.hidden)shown++;}section.hidden=!shown;}}filterSelect.onchange=filterCards;document.getElementById('card-order').addEventListener('change',filterCards);</script><style>.card[hidden]{display:none!important}#card-filter{margin-right:20px}</style><style>.section-count{font-size:21px;font-weight:700;line-height:1.55;color:#f3dfb2;max-width:950px;margin:0 0 22px}.draft-note{font-size:18px;font-weight:600;line-height:1.6}@media(max-width:600px){.section-count{font-size:18px}}</style><style>.copy-count{display:inline-block;font-size:.7em;white-space:nowrap;font-weight:800;border-radius:20px;padding:3px 9px;background:#ffffff45;vertical-align:middle}</style></html>
